name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo bench --no-run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p j1939-cli --bin bam_demo
      - run: python -m pip install -e "python/[test]"
      - run: python -m pytest python/tests --junitxml=report.xml --cov=python --cov-report=xml:coverage.xml
      - run: python .github/scripts/plugin-vocab-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-reports
          path: |
            report.xml
            coverage.xml

