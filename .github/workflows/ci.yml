name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --format=pretty 2>&1 | tee rust-tests.txt
      - run: cargo bench --no-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-evidence
          path: rust-tests.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.82.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build -p j1939-cli --bin bam_demo
      - run: python -m pip install -e "python/[test]"
      - run: python -m pytest python/tests --junitxml=report.xml --cov=python --cov-report=xml:coverage.xml
      - run: python .github/scripts/plugin-vocab-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-evidence
          path: |
            report.xml
            coverage.xml

  verification-report:
    if: always()
    needs: [rust, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-evidence"
          path: evidence
          merge-multiple: true
      - name: Generate scenario report and status files
        run: python .github/scripts/generate-verification-report.py verification-evidence evidence/rust-tests.txt evidence/report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: verification-evidence/

